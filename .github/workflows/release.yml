name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (ignored when publish_tag is set)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      publish_tag:
        description: 'Publish an EXISTING tag instead of cutting a new release, e.g. v1.3.2. Use this when a release tagged and pushed but npm publishing failed.'
        required: false
        type: string
        default: ''

# Never two releases at once: a second dispatch while one runs would bump from
# a stale version and race the atomic tag push. cancel-in-progress stays false
# — an in-flight release must finish or fail, never be killed halfway.
# (The CI deploy job can still push to main concurrently; that race fails
# loudly as a non-fast-forward push, which is the safe outcome.)
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Verifiserer, bumper versjon og pusher commit + tag atomisk.
  # npm-publisering skjer i egen jobb ETTER at git-push har lykkes,
  # slik at npm og git aldri kommer ut av synk.
  release:
    # Skipped entirely when republishing an existing tag: the version is
    # already bumped, committed and tagged, and re-running this job would try
    # to create a tag that exists and fail.
    if: inputs.publish_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      # Testpolicy: ingenting publiseres utestet — full kvalitetssjekk før versjonsbump.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test (full regression before release)
        run: npm test

      - name: Build package
        run: npm run build

      - name: Bump version
        id: version
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version ${{ inputs.version }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          DATE=$(date +%Y-%m-%d)

          # Get the previous tag (if any)
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Collect commits since last tag (or all commits if no tag)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi

          # Build the new changelog entry
          ENTRY="## ${NEW_VERSION} (${DATE})"$'\n\n'"${COMMITS}"

          # Prepend to CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(cat CHANGELOG.md)
            # Remove the header line if it exists
            BODY=$(echo "$EXISTING" | sed '1{/^# /d;}')
            echo -e "# Changelog\n\n${ENTRY}\n\n${BODY}" > CHANGELOG.md
          else
            echo -e "# Changelog\n\n${ENTRY}" > CHANGELOG.md
          fi

      # Annotert tag (--follow-tags hopper over lettvekts-tags) og atomisk
      # push av commit + tag: enten lander begge, eller ingen av dem.
      - name: Commit, tag and push atomically
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          # The AI-context artifacts embed the package version; without this
          # regeneration every branch cut from main after a release failed the
          # artifact-freshness gate until someone refreshed them by hand.
          npm run generate-metadata
          npm run update-ai-guide-components
          npm run generate-ai-context-manifest
          git add package.json package-lock.json CHANGELOG.md metadata.json AI_DESIGN_SYSTEM_GUIDE.md ai-context.manifest.json
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push --atomic origin main "refs/tags/v${NEW_VERSION}"

  # Publiserer taggen som release-jobben pushet. Idempotent: en re-kjøring
  # sjekker ut samme tag og publiserer samme artefakt. Feiler npm-publisering
  # (tag finnes på git, ingenting på npm): re-kjør kun denne jobben.
  # Publiser aldri en annen artefakt under et eksisterende versjonsnummer.
  publish:
    needs: release
    # always(): `needs` would otherwise skip this job whenever release is
    # skipped, which is exactly the republish case.
    if: always() && (inputs.publish_tag != '' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Trusted publishing: npm verifies a short-lived OIDC token minted by
      # GitHub for this repo and workflow, so no npm secret is involved at all.
      # Token publishing kept failing with EOTP because the account requires a
      # 2FA code on writes and a CI runner has no authenticator; OIDC is exempt
      # by design, and there is no secret left to expire or rotate.
      id-token: write
    steps:
      # Fritekst-inputen når aldri shellet som interpolert kode: den kommer
      # inn via env og formatvalideres her, så alt nedstrøms som interpolerer
      # de resolvede outputs jobber med en verdi som er garantert vX.Y.Z.
      - name: Resolve the tag to publish
        id: target
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -n "$PUBLISH_TAG" ]; then
            TAG="$PUBLISH_TAG"
          else
            TAG="v${RELEASE_VERSION}"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ugyldig tag «${TAG}» — forventer vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publiserer ${TAG}"

      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          # Denne jobben pusher aldri git; ingen grunn til at credentials
          # ligger på disk mens npm ci og prepack-bygget kjører.
          persist-credentials: false

      # Publiser aldri en annen artefakt under et eksisterende versjonsnummer:
      # taggen og manifestet må være enige om versjonen.
      - name: Verify the tag matches package.json
        run: |
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "${MANIFEST}" != "${{ steps.target.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.target.outputs.tag }} peker på package.json ${MANIFEST}"
            exit 1
          fi
          echo "package.json ${MANIFEST} stemmer med taggen."

      # Idempotent republisering: hopp ut hvis versjonen allerede ligger på npm,
      # i stedet for å feile på E403/EPUBLISHCONFLICT.
      - name: Skip if the version is already on npm
        id: exists
        run: |
          if npm view "rk-designsystem@${{ steps.target.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::rk-designsystem@${{ steps.target.outputs.version }} finnes allerede på npm — hopper over publisering."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing landed in npm 11.5.1; Node 20 ships npm 10.x, which
      # would silently fall back to token auth and fail the same way again.
      # Pinnet, ikke @latest: publiseringsjobben holder id-token: write, og
      # en kompromittert npm-utgivelse i publiseringsløypa er verst tenkelige
      # sted for en upinnet avhengighet. Bump versjonen bevisst.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: npm ci

      # Republiseringsstien (publish_tag satt) hopper over release-jobben og
      # dermed hele kvalitetsgaten — men taggen den publiserer kan være laget
      # utenfor denne workflowen. Kjør derfor gaten her i det tilfellet, mot
      # nøyaktig treet som publiseres. (Den vanlige stien er allerede gatet i
      # release-jobben; å gjenta den her ville doblet kjøretiden for hver
      # release uten å teste noe nytt.)
      - name: Lint (republish path)
        if: inputs.publish_tag != '' && steps.exists.outputs.already == 'false'
        run: npm run lint

      - name: Typecheck (republish path)
        if: inputs.publish_tag != '' && steps.exists.outputs.already == 'false'
        run: npm run typecheck

      - name: Install Playwright browsers (republish path)
        if: inputs.publish_tag != '' && steps.exists.outputs.already == 'false'
        run: npx playwright install chromium

      - name: Test (republish path)
        if: inputs.publish_tag != '' && steps.exists.outputs.already == 'false'
        run: npm test

      # dist/ er gitignored og finnes ikke etter checkout — prepack-hooken i
      # package.json bygger den automatisk under npm publish.
      # (1.3.0 ble publisert av den gamle én-jobbs-workflowen som bygde selv;
      # uten hooken ville denne jobben publisert en tarball uten dist/.)
      # Hooken var prepublishOnly, som IKKE kjører for `npm pack`: en manuell
      # pakking av et rent tre ga en tarball på tre filer uten kode. prepack
      # kjører for begge, så pakking og publisering nå alltid bygger.
      # Both credentials on purpose. npm prefers the OIDC exchange when a
      # trusted publisher is registered for this repo and workflow, and falls
      # back to NODE_AUTH_TOKEN when one is not — so the release works either
      # way. Dropping the token left the job with NO credential at all, which
      # only surfaces AFTER the release job has bumped, tagged and pushed.
      - name: Publish to npm
        if: steps.exists.outputs.already == 'false'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION="${{ steps.target.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          # Extract this version's changelog section for the release notes
          PREV_TAG=$(git describe --tags --abbrev=0 "v${NEW_VERSION}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..v${NEW_VERSION}" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi

          # Idempotent: en republisering skal ikke feile på at GitHub-releasen
          # allerede finnes.
          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "::notice::GitHub-release v${NEW_VERSION} finnes allerede — hopper over."
          else
            gh release create "v${NEW_VERSION}" \
              --title "v${NEW_VERSION} (${DATE})" \
              --notes "$NOTES"
          fi
