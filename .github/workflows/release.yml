name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # Verifiserer, bumper versjon og pusher commit + tag atomisk.
  # npm-publisering skjer i egen jobb ETTER at git-push har lykkes,
  # slik at npm og git aldri kommer ut av synk.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.new }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: 'npm'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      # Testpolicy: ingenting publiseres utestet — full kvalitetssjekk før versjonsbump.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test (full regression before release)
        run: npm test

      - name: Build package
        run: npm run build

      - name: Bump version
        id: version
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version ${{ inputs.version }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          DATE=$(date +%Y-%m-%d)

          # Get the previous tag (if any)
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          # Collect commits since last tag (or all commits if no tag)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi

          # Build the new changelog entry
          ENTRY="## ${NEW_VERSION} (${DATE})"$'\n\n'"${COMMITS}"

          # Prepend to CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            EXISTING=$(cat CHANGELOG.md)
            # Remove the header line if it exists
            BODY=$(echo "$EXISTING" | sed '1{/^# /d;}')
            echo -e "# Changelog\n\n${ENTRY}\n\n${BODY}" > CHANGELOG.md
          else
            echo -e "# Changelog\n\n${ENTRY}" > CHANGELOG.md
          fi

      # Annotert tag (--follow-tags hopper over lettvekts-tags) og atomisk
      # push av commit + tag: enten lander begge, eller ingen av dem.
      - name: Commit, tag and push atomically
        run: |
          NEW_VERSION="${{ steps.version.outputs.new }}"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push --atomic origin main "refs/tags/v${NEW_VERSION}"

  # Publiserer taggen som release-jobben pushet. Idempotent: en re-kjøring
  # sjekker ut samme tag og publiserer samme artefakt. Feiler npm-publisering
  # (tag finnes på git, ingenting på npm): re-kjør kun denne jobben.
  # Publiser aldri en annen artefakt under et eksisterende versjonsnummer.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # dist/ er gitignored og finnes ikke etter checkout — prepublishOnly-
      # hooken i package.json bygger den automatisk under npm publish.
      # (1.3.0 ble publisert av den gamle én-jobbs-workflowen som bygde selv;
      # uten hooken ville denne jobben publisert en tarball uten dist/.)
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION="${{ needs.release.outputs.version }}"
          DATE=$(date +%Y-%m-%d)

          # Extract this version's changelog section for the release notes
          PREV_TAG=$(git describe --tags --abbrev=0 "v${NEW_VERSION}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..v${NEW_VERSION}" --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          fi

          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION} (${DATE})" \
            --notes "$NOTES"
