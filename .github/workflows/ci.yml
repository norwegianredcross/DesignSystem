name: CI

# Testpolicy: test tidlig og kontinuerlig, full regresjon på hver endring,
# ingenting produksjonssettes utestet (se TESTING.md).
on:
  push:
    branches:
      - main
  pull_request:

# One run per ref at a time. On PRs a newer push supersedes the running check
# (cancel-in-progress), so pushed fixes don't queue behind stale runs. On main
# the deploy job pushes a token-bump commit and publishes Pages — cancelling
# that mid-run could leave a half-deployed state, so main runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Full kvalitetssjekk av innsendt kode — kjøres på hver PR og hver push.
  # Dette er regresjonstesten: hele suiten, ikke bare det som er endret.
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Token check (all --ds-* references must exist)
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test (full regression, all stories + a11y)
        run: npm test

      - name: Build package
        run: npm run build

      - name: Packaging smoke test (pack → install → computed styles)
        run: npm run test:packaging

      - name: Build Storybook
        run: npm run build-storybook

      # build-storybook regenererte nettopp metadata.json, AI-guiden og
      # manifestet. Avviker de fra de innsjekkede filene, har PR-en endret
      # komponent-API uten å regenerere AI-kontekstartefaktene — det stoppes
      # her, i stedet for at utdatert kontekst publiseres nedstrøms.
      - name: Generated AI-context artifacts are fresh
        run: git diff --exit-code metadata.json AI_DESIGN_SYSTEM_GUIDE.md ai-context.manifest.json

      # Skjermbildesammenligning av nøkkelstories mot innsjekkede baselines.
      # Bootstrap: mangler baselines helt, genereres de i stedet for å feile —
      # last ned artefakten «visual-screenshots» og sjekk dem inn. Ved
      # tilsiktede visuelle endringer: kjør workflowen «Update visual
      # baselines» på branchen.
      - name: Visual regression (key stories)
        run: |
          if [ -d tests/visual/__screenshots__ ]; then
            npm run test:visual
          else
            echo "::warning::Ingen baselines er sjekket inn - genererer nye. Last ned artefakten og commit tests/visual/__screenshots__."
            npm run test:visual:update
          fi

      # Ved diff inneholder artefakten expected/actual/diff-bilder for review;
      # ved bootstrap inneholder den de nye baselines.
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-screenshots
          path: |
            tests/visual/__screenshots__
            test-results
          if-no-files-found: ignore

      - name: Build Main Application
        run: npm run build:app

  # Deploy kjøres kun på push til main, og kun når testjobben er grønn.
  # Bruker jobbens innebygde GITHUB_TOKEN (ingen PAT å vedlikeholde/utløpe).
  # Token-oppdateringer auto-committes IKKE her lenger — de kommer som
  # reviewbare PR-er fra workflowen «Token bump PR» (med full testsuite og
  # visuell regresjon som gate). Deploy bygger alltid lockfilens tilstand.
  deploy:
    name: Build & deploy
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Jobben har contents: write, men gh-pages-pushen får tokenet
          # eksplisitt — ingen grunn til at credentials ligger på disk
          # mens npm ci og byggene kjører.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # build-storybook also copies the AI-context artifacts (metadata, guide,
      # manifest) into storybook-build/ - see scripts/copy-ai-artifacts.mjs.
      - name: Build Storybook
        run: npm run build-storybook

      - name: Build Main Application
        run: npm run build:app

      - name: Prepare combined deploy directory
        run: |
          mkdir -p deploy-output/storybook
          cp -r dist-app/* deploy-output/
          cp -r storybook-build/* deploy-output/storybook/

      - name: Deploy to GitHub Pages
        run: |
          npx gh-pages \
            --repo https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
            -d deploy-output
