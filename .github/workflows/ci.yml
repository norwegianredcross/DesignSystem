name: CI

# Testpolicy: test tidlig og kontinuerlig, full regresjon på hver endring,
# ingenting produksjonssettes utestet (se TESTING.md).
on:
  push:
    branches:
      - main
  pull_request:

# One run per ref at a time. On PRs a newer push supersedes the running check
# (cancel-in-progress), so pushed fixes don't queue behind stale runs. On main
# the deploy job pushes a token-bump commit and publishes Pages — cancelling
# that mid-run could leave a half-deployed state, so main runs queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Full kvalitetssjekk av innsendt kode — kjøres på hver PR og hver push.
  # Dette er regresjonstesten: hele suiten, ikke bare det som er endret.
  test:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Token check (all --ds-* references must exist)
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test (full regression, all stories + a11y)
        run: npm test

      - name: Build package
        run: npm run build

      - name: Packaging smoke test (pack → install → computed styles)
        run: npm run test:packaging

      - name: Build Storybook
        run: npm run build-storybook

      # build-storybook regenererte nettopp metadata.json, AI-guiden og
      # manifestet. Avviker de fra de innsjekkede filene, har PR-en endret
      # komponent-API uten å regenerere AI-kontekstartefaktene — det stoppes
      # her, i stedet for at utdatert kontekst publiseres nedstrøms.
      - name: Generated AI-context artifacts are fresh
        run: git diff --exit-code metadata.json AI_DESIGN_SYSTEM_GUIDE.md ai-context.manifest.json

      - name: Build Main Application
        run: npm run build:app

  # Deploy kjøres kun på push til main, og kun når testjobben er grønn.
  # Token-oppdateringen testes FØR den committes og deployes.
  # Bruker jobbens innebygde GITHUB_TOKEN (ingen PAT å vedlikeholde/utløpe).
  deploy:
    name: Update tokens, verify & deploy
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Update design tokens package
        run: npm update rk-design-tokens

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test with updated tokens (regression before commit/deploy)
        run: npm test

      - name: Commit and Push Dependency Updates
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore(deps): update rk-design-tokens to latest [skip ci]"

      - name: Build package
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Copy Metadata
        run: cp metadata.json storybook-build/metadata.json

      - name: Copy AI Design System Guide
        run: cp AI_DESIGN_SYSTEM_GUIDE.md storybook-build/AI_DESIGN_SYSTEM_GUIDE.md

      # The manifest advertises its own URL under /storybook/ — without this
      # copy the deployed manifestUrl 404s. `build-storybook` regenerated the
      # file at the repo root two steps earlier, so this copy is always fresh.
      - name: Copy AI Context Manifest
        run: cp ai-context.manifest.json storybook-build/ai-context.manifest.json

      - name: Build Main Application
        run: npm run build:app

      - name: Prepare combined deploy directory
        run: |
          mkdir -p deploy-output/storybook
          cp -r dist-app/* deploy-output/
          cp -r storybook-build/* deploy-output/storybook/

      - name: Deploy to GitHub Pages
        run: |
          npx gh-pages \
            --repo https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git \
            -d deploy-output
