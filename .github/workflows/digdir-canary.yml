name: Digdir canary

# Peer-kontrakten er ~1.13.2, men lockfilen tester alltid nøyaktig én versjon.
# Denne ukentlige kanarien kjører hele testsuiten mot tre punkter:
#
#   minimum          gulvet i peer-spennet
#   newest           taket i peer-spennet
#   upstream-latest  nyeste 1.x uansett spenn — informativ, blokkerer ikke
#
# De to første vokter spennet vi lover. Den tredje finnes fordi de to første
# ikke kan se forbi det: med ~1.13.2 kjørte kanarien 1.13.2 mot 1.13.3 mens
# Digdir stod på 1.21.0, så avstanden vokste uten at noe sa fra. Nå rapporterer
# upstream-legget hver uke hva som skal til for å heve taket.
#
# Feiler «newest», har Digdir endret noe INNENFOR spennet som treffer oss (mest
# utsatt: EXPERIMENTAL_Suggestion, som er re-eksportert som stabilt API) — da må
# enten koden tilpasses eller spennet strammes inn FØR konsumenter treffer det
# samme. Feiler «upstream-latest», er det ventet inntil taket heves; se
# jobbsammendraget for hvilke komponenter som står i veien.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  canary:
    name: Digdir ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Det informative legget skal ikke gjøre den ukentlige kjøringen rød; et
    # permanent rødt kryss blir ignorert. Resultatet står i jobbsammendraget.
    continue-on-error: ${{ matrix.leg == 'upstream-latest' }}
    strategy:
      fail-fast: false
      matrix:
        leg: [minimum, newest, upstream-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --no-save: kanarien skal aldri endre lockfilen, bare node_modules.
      # designsystemet-types installeres alltid i samme versjon som -react,
      # ellers nester npm en ekstra kopi og fargeaugmenteringen mister effekt
      # (se kommentaren i src/types.ts).
      - name: Pin Digdir to the ${{ matrix.leg }} in-range version
        run: |
          RANGE=$(node -p "require('./package.json').peerDependencies['@digdir/designsystemet-react']")
          if [ "${{ matrix.leg }}" = "upstream-latest" ]; then
            # Bevisst utenfor peer-spennet: dette legget måler avstanden til
            # oppstrøms, som spennet per definisjon ikke kan vise.
            RANGE="^1.0.0"
          fi
          if [ "${{ matrix.leg }}" = "minimum" ]; then
            VERSION=$(node -p "'${RANGE}'.replace(/^[^0-9]*/, '')")
          else
            VERSION=$(npm view "@digdir/designsystemet-react@${RANGE}" version --json | node -p "const v=JSON.parse(require('fs').readFileSync(0,'utf8')); Array.isArray(v)?v[v.length-1]:v")
          fi
          echo "Tester mot @digdir/*@${VERSION}"
          npm install --no-save \
            "@digdir/designsystemet-react@${VERSION}" \
            "@digdir/designsystemet-css@${VERSION}" \
            "@digdir/designsystemet-types@${VERSION}"
          # Not `npm ls`: the leg deliberately installs a version that differs
          # from the root manifest's pin, and npm ls fails the whole job on
          # that intentional mismatch (ELSPROBLEMS). Read what is actually on
          # disk instead, and assert it matches the requested version.
          for pkg in designsystemet-react designsystemet-types designsystemet-css; do
            # Read by file path: the Digdir exports maps do not expose
            # ./package.json, so require('@digdir/…/package.json') throws
            # ERR_PACKAGE_PATH_NOT_EXPORTED.
            INSTALLED=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@digdir/${pkg}/package.json','utf8')).version")
            echo "@digdir/${pkg}: ${INSTALLED}"
            if [ "${INSTALLED}" != "${VERSION}" ]; then
              echo "::error::@digdir/${pkg} er ${INSTALLED}, forventet ${VERSION}"
              exit 1
            fi
          done

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Test (full suite against pinned Digdir)
        id: suite
        run: npm test

      - name: Report to the job summary
        if: always()
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@digdir/designsystemet-react/package.json','utf8')).version")
          PEER=$(node -p "require('./package.json').peerDependencies['@digdir/designsystemet-react']")
          if [ "${{ steps.suite.outcome }}" = "success" ]; then RESULT="passed"; else RESULT="FAILED"; fi
          {
            echo "### Digdir ${{ matrix.leg }}: \`${VERSION}\` — ${RESULT}"
            echo ""
            echo "Peer-spenn i dag: \`${PEER}\`"
            if [ "${{ matrix.leg }}" = "upstream-latest" ] && [ "${RESULT}" = "FAILED" ]; then
              echo ""
              echo "Oppstrøms har gått videre og suiten feiler der. Taket kan ikke heves"
              echo "før de feilende testene slutter å hevde Digdirs interne ARIA-struktur."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build package
        run: npm run build
