name: Update visual baselines

# Regenererer skjermbilde-baselines og committer dem til valgt branch.
# Kjøres ved TILSIKTEDE visuelle endringer (f.eks. token-bump eller
# Digdir-oppgradering) — diffen i baselines blir da en del av PR-review.
# Baselines må genereres her (Linux-runner): lokale skjermbilder fra
# macOS/Windows har annen font-rendering og matcher aldri CI.
on:
  workflow_dispatch:

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Baselines er fasiten den visuelle gaten dømmer etter. Å regenerere
      # dem rett på main normaliserer enhver regresjon uten review — kjør
      # workflowen på PR-branchen i stedet, så blir baseline-diffen en del
      # av PR-en. Feiler høylytt i stedet for å skippe stille, slik at en
      # feildispatch ikke ser ut som en vellykket kjøring.
      - name: Refuse to run on the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Baselines regenereres aldri direkte på ${GITHUB_REF_NAME} — dispatch workflowen på PR-branchen."
          exit 1

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Regenerate baselines
        run: npm run test:visual:update

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines er uendret."
          else
            git commit -m "chore: update visual baselines"
            git push
          fi
