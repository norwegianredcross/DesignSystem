name: Update visual baselines

# Regenererer skjermbilde-baselines og committer dem til valgt branch.
# Kjøres ved TILSIKTEDE visuelle endringer (f.eks. token-bump eller
# Digdir-oppgradering) — diffen i baselines blir da en del av PR-review.
# Baselines må genereres her (Linux-runner): lokale skjermbilder fra
# macOS/Windows har annen font-rendering og matcher aldri CI.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Regenerate baselines
        run: npm run test:visual:update

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines er uendret."
          else
            git commit -m "chore: update visual baselines"
            git push
          fi
