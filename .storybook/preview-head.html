<!-- Source Sans 3 is self-hosted (variable font, latin subset, OFL license).
     Loading it from Google Fonts made the visual regression tests depend on
     the network: an intermittent fetch failure meant screenshots rendered in
     the fallback font and produced false diffs. The relative URL resolves
     both at dev-server root and under the GitHub Pages base path. -->
<style>
  @font-face {
    font-family: 'Source Sans 3';
    font-style: normal;
    font-weight: 200 900;
    font-display: swap;
    src: url('./fonts/source-sans-3-latin.woff2') format('woff2');
  }
</style>
<style>
    body {
        margin: 0 !important;
        padding: 0 !important;
    }
</style>
